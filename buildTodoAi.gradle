buildscript {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
    dependencies { classpath 'net.fabricmc:fabric-loom:1.17.21' }
}
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'java'
group = 'dev.pvputils'
version = '1.0.0'
base { archivesName = 'backtrack' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.5+26.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    filesMatching('fabric.modTodoAi.json') { name = 'fabric.mod.json' }
    filesMatching('assets/backtrack/lang/en_usTodoAi.json') { name = 'en_us.json' }
}
test { useJUnitPlatform() }
tasks.withType(Jar).configureEach { includeEmptyDirs = false }
jar { from('LICENSE') }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'backtrack-gametest'
        enableGameTests = false
        eula = true
    }
}
tasks.named('processGametestResources') {
    filesMatching('fabric.modTodoAi.json') { name = 'fabric.mod.json' }
}
tasks.named('runClientGameTest') { timeout = java.time.Duration.ofMinutes(5) }

loom { runs { client { runDir 'run/backtrackTodoAi' } } }
